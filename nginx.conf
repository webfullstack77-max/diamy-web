# Redirigir todo HTTP → HTTPS
server {
    listen 80;
    server_name diamylasercut.com.mx www.diamylasercut.com.mx admin.diamylasercut.com.mx;
    return 301 https://$host$request_uri;
}

# ── Sitio público ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name diamylasercut.com.mx www.diamylasercut.com.mx;

    ssl_certificate     /etc/letsencrypt/live/diamylasercut.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diamylasercut.com.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Imágenes subidas servidas directamente por Nginx (más rápido)
    location /uploads/ {
        alias   /var/www/diamy/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── PDF Studio (uso interno, protegido con basic auth) ──
    location /pdf/ {
        auth_basic           "Acceso restringido";
        auth_basic_user_file /etc/nginx/.htpasswd_pdf;
        alias                /var/www/diamy/public/pdf/;
        index                index.html;
    }

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Panel admin ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.diamylasercut.com.mx;

    ssl_certificate     /etc/letsencrypt/live/admin.diamylasercut.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.diamylasercut.com.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
